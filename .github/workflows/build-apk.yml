name: Build Meu Veículo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Extrair projeto
        run: unzip -q MeuVeiculoAndroid-projeto.zip -d source
      - name: Compilar APK
        working-directory: source/MeuVeiculoAndroid
        run: gradle --no-daemon assembleDebug
      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: meu-veiculo-apk
          path: source/MeuVeiculoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK para baixar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meu-veiculo-v1.0.2
          name: Meu Veículo Android 1.0.2
          body: APK de instalação direta para Android 5.0 ou superior, agora com tema escuro nas telas e relatórios em PDF escuro.
          prerelease: true
          files: source/MeuVeiculoAndroid/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
